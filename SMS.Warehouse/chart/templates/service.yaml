apiVersion: v1
kind: Service
metadata:
  name: {{ include "sms-warehouse.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sms-warehouse.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "sms-warehouse.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
