apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sms-warehouse.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sms-warehouse.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "sms-warehouse.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sms-warehouse.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: warehouse
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "sms-warehouse.fullname" . }}
                  key: DATABASE_URL
            {{- if .Values.allowedOrigins }}
            - name: ALLOWED_ORIGINS
              value: {{ .Values.allowedOrigins | quote }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.service.port }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
